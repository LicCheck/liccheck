<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LicCheck — Справочник лицензий</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="gradient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <div class="logo-icon">⚖️</div>
                <div class="logo-text">
                    <span class="logo-title">LicCheck</span>
                    <span class="logo-badge">BETA</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-header" id="openAddModalBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Предложить лицензию
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="hero">
                <h1 class="hero-title">
                    Лицензионный<br>
                    <span class="hero-gradient">светофор</span>
                </h1>
                <p class="hero-subtitle">
                    Мгновенно узнайте, можно ли использовать код в коммерческом проекте
                </p>
            </div>

            <div class="search-card">
                <div class="search-wrapper">
                    <div class="search-icon">🔍</div>
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск лицензии (MIT, GPL, Apache...)" oninput="handleSearchInput()">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
                </div>
                
                <div class="filter-chips" id="filterChips">
                    <button class="chip active" data-color="all" onclick="setFilter('all', this)">📋 Все</button>
                    <button class="chip chip-green" data-color="green" onclick="setFilter('green', this)">🟢 Свободные</button>
                    <button class="chip chip-yellow" data-color="yellow" onclick="setFilter('yellow', this)">🟡 Осторожно</button>
                    <button class="chip chip-red" data-color="red" onclick="setFilter('red', this)">🔴 Строгие</button>
                </div>
                
                <div class="stats-bar">
                    <div class="stats-info">
                        <span class="stats-count" id="statsCount">0</span>
                        <span class="stats-label" id="statsLabel">лицензий</span>
                    </div>
                    <div class="stats-badges">
                        <span class="badge-green">🟢 Свободные</span>
                        <span class="badge-yellow">🟡 Требуют проверки</span>
                        <span class="badge-red">🔴 Раскрывают код</span>
                    </div>
                </div>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>

            <div class="load-more-wrapper" id="loadMoreWrapper" style="display: none;">
                <button class="btn-load-more" id="loadMoreBtn" onclick="loadMore()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 1 1-9-9m0 0v6m0-6h6"/>
                    </svg>
                    Загрузить ещё
                </button>
            </div>
        </div>
    </main>

    <!-- Плавающая кнопка входа для модератора -->
    <button class="modal-login-btn" id="moderatorLoginBtn" title="Вход для модераторов">
        🔐
    </button>

    <!-- Модальное окно добавления лицензии -->
    <div class="modal" id="licenseModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2>➕ Предложить лицензию</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="addLicenseForm">
                <div class="form-group">
                    <label>Название лицензии *</label>
                    <input type="text" id="licenseName" placeholder="например, MIT License" required>
                </div>
                <div class="form-group">
                    <label>Цвет светофора *</label>
                    <div class="color-selector">
                        <label class="color-option green">
                            <input type="radio" name="licenseColor" value="green" checked>
                            <span>🟢 Свободная</span>
                        </label>
                        <label class="color-option yellow">
                            <input type="radio" name="licenseColor" value="yellow">
                            <span>🟡 Осторожно</span>
                        </label>
                        <label class="color-option red">
                            <input type="radio" name="licenseColor" value="red">
                            <span>🔴 Строгая</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>✅ Можно (каждое с новой строки)</label>
                    <textarea id="canDoRows" rows="3" placeholder="Использовать в коммерции&#10;Модифицировать код&#10;Распространять"></textarea>
                </div>
                <div class="form-group">
                    <label>❌ Нельзя (каждое с новой строки)</label>
                    <textarea id="cannotDoRows" rows="2" placeholder="Убирать имя автора&#10;Закрывать исходный код"></textarea>
                </div>
                <div class="form-group">
                    <label>⚠️ Нужно (каждое с новой строки)</label>
                    <textarea id="mustDoRows" rows="2" placeholder="Сохранить текст лицензии&#10;Указать авторство"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-primary">💾 Отправить на модерацию</button>
                </div>
            </form>
            <div class="modal-note">
                ⚡ Лицензия будет проверена модератором перед добавлением
            </div>
        </div>
    </div>

    <!-- Toast уведомления -->
    <div class="toast" id="toast"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        // Обработчик кнопки входа модератора
        document.getElementById('moderatorLoginBtn').addEventListener('click', () => {
            const token = localStorage.getItem('moderatorToken');
            if (token) {
                fetch('/api/auth/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.ok) {
                        window.location.href = '/admin.html';
                    } else {
                        localStorage.removeItem('moderatorToken');
                        window.location.href = '/login.html';
                    }
                })
                .catch(() => {
                    window.location.href = '/login.html';
                });
            } else {
                window.location.href = '/login.html';
            }
        });
        
        // Обработчик формы добавления лицензии
        document.getElementById('addLicenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('licenseName').value.trim();
            const color = document.querySelector('input[name="licenseColor"]:checked').value;
            const canDo = document.getElementById('canDoRows').value.split('\n').filter(l => l.trim());
            const cannotDo = document.getElementById('cannotDoRows').value.split('\n').filter(l => l.trim());
            const mustDo = document.getElementById('mustDoRows').value.split('\n').filter(l => l.trim());
            
            if (!name) {
                showToast('Введите название лицензии', 'error');
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '⏳ Отправка...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/user/license', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name, color, canDo, cannotDo, mustDo,
                        submittedBy: 'anonymous'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    closeModal();
                    document.getElementById('addLicenseForm').reset();
                } else {
                    showToast(data.error, 'error');
                }
            } catch (error) {
                showToast('Ошибка соединения', 'error');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
