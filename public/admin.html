<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Панель модератора — LicCheck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Дополнительные стили для админ-панели */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-title h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #a8a8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            background: rgba(232, 67, 147, 0.2);
            border: 1px solid rgba(232, 67, 147, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #e84393;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 40px;
        }

        .admin-user span {
            color: rgba(255,255,255,0.7);
        }

        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: rgba(232, 67, 147, 0.3);
            border-color: #e84393;
        }

        /* Табы */
        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .admin-tab {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: rgba(255,255,255,0.7);
        }

        .admin-tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .admin-tab.active {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }

        /* Панели */
        .admin-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .admin-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Таблица запросов */
        .requests-table, .licenses-table {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr 1fr;
            background: rgba(0,0,0,0.3);
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr 1fr;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
            transition: 0.2s;
        }

        .table-row:hover {
            background: rgba(255,255,255,0.05);
        }

        .license-name {
            font-weight: 600;
            color: white;
        }

        .license-color {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .color-green { background: #00b894; box-shadow: 0 0 5px #00b894; }
        .color-yellow { background: #fdcb6e; box-shadow: 0 0 5px #fdcb6e; }
        .color-red { background: #e84393; box-shadow: 0 0 5px #e84393; }

        .request-actions, .license-actions {
            display: flex;
            gap: 10px;
        }

        .btn-approve {
            background: rgba(0, 184, 148, 0.2);
            border: 1px solid rgba(0, 184, 148, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #00b894;
            transition: 0.2s;
        }

        .btn-approve:hover {
            background: rgba(0, 184, 148, 0.4);
        }

        .btn-reject {
            background: rgba(232, 67, 147, 0.2);
            border: 1px solid rgba(232, 67, 147, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #e84393;
            transition: 0.2s;
        }

        .btn-reject:hover {
            background: rgba(232, 67, 147, 0.4);
        }

        .btn-edit {
            background: rgba(253, 203, 110, 0.2);
            border: 1px solid rgba(253, 203, 110, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #fdcb6e;
        }

        .btn-delete {
            background: rgba(232, 67, 147, 0.2);
            border: 1px solid rgba(232, 67, 147, 0.3);
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: #e84393;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: rgba(255,255,255,0.5);
        }

        .submitter-info {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .reject-reason {
            font-size: 11px;
            color: #e84393;
            margin-top: 4px;
        }

        /* Модальное окно редактирования */
        .edit-modal .modal-container {
            max-width: 500px;
        }

        .badge-pending {
            background: rgba(253, 203, 110, 0.2);
            color: #fdcb6e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .badge-approved {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }

        @media (max-width: 768px) {
            .table-header, .table-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .table-header {
                display: none;
            }
            .table-row {
                padding: 16px;
                border-radius: 16px;
                margin-bottom: 12px;
                background: rgba(255,255,255,0.05);
            }
            .request-actions, .license-actions {
                justify-content: flex-end;
            }
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-title">
                <div class="logo-icon" style="font-size: 36px;">⚖️</div>
                <div>
                    <h1>Панель модератора</h1>
                    <div class="admin-badge">LicCheck PRO</div>
                </div>
            </div>
            <div class="admin-user">
                <span>👤 <span id="adminUsername">moderator</span></span>
                <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="requests" onclick="switchTab('requests')">
                📋 Запросы на добавление <span id="requestsCount" style="margin-left: 6px;">(0)</span>
            </button>
            <button class="admin-tab" data-tab="licenses" onclick="switchTab('licenses')">
                ✏️ Управление лицензиями
            </button>
        </div>

        <!-- Панель запросов -->
        <div class="admin-panel active" id="requestsPanel">
            <div class="requests-table" id="requestsTable">
                <div class="table-header">
                    <div>Название</div>
                    <div>Цвет</div>
                    <div>От кого</div>
                    <div>Действия</div>
                </div>
                <div id="requestsList">
                    <div class="empty-state">Загрузка запросов...</div>
                </div>
            </div>
        </div>

        <!-- Панель управления лицензиями -->
        <div class="admin-panel" id="licensesPanel">
            <div class="licenses-table">
                <div class="table-header">
                    <div>Название</div>
                    <div>Цвет</div>
                    <div>Тип</div>
                    <div>Действия</div>
                </div>
                <div id="licensesList">
                    <div class="empty-state">Загрузка лицензий...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования лицензии -->
    <div class="modal edit-modal" id="editModal">
        <div class="modal-overlay" onclick="closeEditModal()"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2>✏️ Редактировать лицензию</h2>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <form id="editLicenseForm">
                <input type="hidden" id="editLicenseId">
                <div class="form-group">
                    <label>Название лицензии</label>
                    <input type="text" id="editLicenseName" required>
                </div>
                <div class="form-group">
                    <label>Цвет светофора</label>
                    <div class="color-selector">
                        <label class="color-option green">
                            <input type="radio" name="editLicenseColor" value="green">
                            <span>🟢 Свободная</span>
                        </label>
                        <label class="color-option yellow">
                            <input type="radio" name="editLicenseColor" value="yellow">
                            <span>🟡 Осторожно</span>
                        </label>
                        <label class="color-option red">
                            <input type="radio" name="editLicenseColor" value="red">
                            <span>🔴 Строгая</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>✅ Можно</label>
                    <textarea id="editCanDo" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>❌ Нельзя</label>
                    <textarea id="editCannotDo" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>⚠️ Нужно</label>
                    <textarea id="editMustDo" rows="2"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Отмена</button>
                    <button type="submit" class="btn-primary">💾 Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/admin.js"></script>
    
    <script>
        // Проверка авторизации при загрузке
        checkAuthAndLoad();
        
        async function checkAuthAndLoad() {
            const token = localStorage.getItem('moderatorToken');
            
            if (!token) {
                window.location.href = '/login.html';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (!data.valid) {
                    localStorage.removeItem('moderatorToken');
                    window.location.href = '/login.html';
                    return;
                }
                
                // Показываем имя модератора
                document.getElementById('adminUsername').textContent = data.username || 'moderator';
                
                // Загружаем данные
                loadPendingRequests();
                loadAllLicenses();
                
            } catch (error) {
                console.error('Auth error:', error);
                window.location.href = '/login.html';
            }
        }
        
        function logout() {
            localStorage.removeItem('moderatorToken');
            localStorage.removeItem('moderatorUsername');
            localStorage.removeItem('moderatorRole');
            window.location.href = '/login.html';
        }
        
        function switchTab(tabName) {
            // Обновляем табы
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`.admin-tab[data-tab="${tabName}"]`).classList.add('active');
            
            // Обновляем панели
            document.querySelectorAll('.admin-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            if (tabName === 'requests') {
                document.getElementById('requestsPanel').classList.add('active');
            } else if (tabName === 'licenses') {
                document.getElementById('licensesPanel').classList.add('active');
                if (window.allLicenses) {
                    renderAllLicenses(window.allLicenses);
                }
            }
        }
    </script>
</body>
</html>
